name: Build Cozy F2 APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Reconstruct complete Android project
        shell: python
        run: |
          import base64, gzip, hashlib, json
          from pathlib import Path, PurePosixPath
          payload = ''
          compressed = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'e7a67db6001fb7df57ca5f35b0563172310f72f57efb41dc55b1a74e7eac15e1', 'Payload checksum mismatch'
          files = json.loads(gzip.decompress(compressed))
          root = Path('project')
          root.mkdir(exist_ok=True)
          for name, content in files.items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              destination = root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(content, encoding='utf-8', newline='')
          assert (root / 'app/src/main/AndroidManifest.xml').is_file()
          assert (root / 'settings.gradle.kts').is_file()
          print('Reconstructed', len(files), 'project files')
      - name: Test protocol encoders
        working-directory: project
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cozy-F2-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encoder-test-reports
          path: project/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

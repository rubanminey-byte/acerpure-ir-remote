name: Build Android APK



on:

  push:

    branches: [ "main", "master" ]

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Unpack Complete Android Project Structure

        run: |

          mkdir -p build_work

          cd build_work

          echo "" | base64 -d | tar -xJ



      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          java-version: '17'

          distribution: 'temurin'



      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v4

        with:

          gradle-version: '8.7'



      - name: Build Debug APK

        working-directory: build_work

        run: gradle :app:assembleDebug --no-daemon --stacktrace



      - name: Upload APK Artifact

        uses: actions/upload-artifact@v4

        with:

          name: AcerpureCozyF2-Remote-APK

          path: build_work/app/build/outputs/apk/debug/app-debug.apk

